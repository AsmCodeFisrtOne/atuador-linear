  maquina.html · SIMULADOR DO DISPLAY DA MÁQUINA DE GELATO · Rev.09 · 2026-10-16
  Faz o papel do display TFT (480×320) até o firmware do Device ficar pronto:
   1 Boas-vindas → 2 Pix (QR real, pedido no Firebase) → 3 Aprovado → 4 Servindo
   → 5 Bom apetite → (6 Reabastecer quando acabam as porções)
  Pagamento confirmado pelo celular do cliente em pagar.html (Firebase RTDB, REST).
  NÃO faz parte do app de configuração (index.html).
  Rev.02 – Usa os parâmetros enviados pelo app (Firebase maquinas/MAQ01/config):
           preço, tempo total e a curva (o copo enche conforme o volume da curva).
           Tela Aprovado fica 3 s.
  Rev.03 – Porções por reservatório vêm do app (volume do reservatório ÷ volume do copo).
  Rev.04 – Dose: segue a curva e para ao completar os passos de 1 copo (dose_passos).
  Rev.05 – Dose = curva inteira (1 ciclo = 1 copo); volumes só contam as doses disponíveis.
  Rev.06 – A curva cobre o RESERVATÓRIO INTEIRO: cada copo avança só o seu trecho da
           curva a partir da posição atual do êmbolo; porções = (restante ÷ copo).
  Rev.07 – Sem "pulo" de preço ao recarregar: usa a última configuração recebida (cache)
           e só desenha após ler o Firebase; não usa mais o preço local do app.
  Rev.08 – Atualização automática: escuta a configuração no Firebase em tempo real
           (+ consulta a cada 5 s); a tela inicial se redesenha sozinha. Venda em
           andamento não é interrompida (o novo valor vale a partir da próxima).
  Rev.09 – Toque longo não abre o menu do navegador.
-->

function blobs(){return `

function header(right=''){return `

 <!-- bateria -->
 <g transform="translate(428 17)"><rect width="30" height="16" rx="4" fill="none" stroke="${C.choc}" stroke-width="2"/><rect x="31" y="5" width="3" height="6" rx="1" fill="${C.choc}"/>
 <rect x="3" y="3" width="18" height="10" rx="2" fill="${C.pist2}"/></g>
 <g transform="translate(404 15)" fill="none" stroke="${C.choc}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".75"><path d="M3 5l10 9-5 4.5V1l5 4.5-10 9"/></g>
 ${right}`;}

// bico do dispenser
function nozzle(drip=false){return `
 <rect x="76" y="40" width="52" height="34" rx="8" fill="url(#noz)" stroke="#9AA2AB"/>
 <path d="M84 74 L120 74 L112 104 L92 104 Z" fill="url(#noz)" stroke="#9AA2AB"/>

 <path d="M98 104 l-3 8 M102 104 v9 M106 104 l3 8" stroke="#9AA2AB" stroke-width="1"/>
 ${drip?`<path d="M102 116 C 96 140 108 150 102 186" stroke="url(#gel)" stroke-width="13" fill="none" stroke-linecap="round"/>`:''}`;}

// copo
function cup(){return `
 <path d="M52 182 L152 182 L138 292 Q102 300 66 292 Z" fill="url(#cup)" filter="url(#sh)"/>
 <path d="M52 182 L152 182" stroke="#F2C3CF" stroke-width="6" stroke-linecap="round"/>
 ${[0,1,2,3].map(i=>`<path d="M${64+i*22} 196 L${71+i*18} 286" stroke="${C.straw}" stroke-width="7" opacity=".55" stroke-linecap="round"/>`).join('')}`;}

// gelato espiral (nível 0..1)
function swirl(level, cherry=false){
  const layers=[ // [cy, rx, ry]
    [176,54,15],[156,46,14],[138,37,13],[122,27,11],[108,16,9]];
  const n=Math.round(level*layers.length*10)/10;
  let s='';
  // gelato dentro do copo
  s+=`<g clip-path="url(#cupClip)"><rect x="40" y="${288-Math.min(1,level*2.2)*104}" width="130" height="120" fill="url(#gel)"/></g>`;
  layers.forEach((l,i)=>{ if(i+1>n+0.001) return; const [cy,rx,ry]=l;
    s+=`<ellipse cx="102" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#gel)" filter="url(#sh)"/>
        <path d="M${102-rx*0.7} ${cy-ry*0.35} Q102 ${cy-ry*1.1} ${102+rx*0.55} ${cy-ry*0.45}" stroke="#fff" stroke-opacity=".55" stroke-width="3" fill="none" stroke-linecap="round"/>`; });
  if(level>=1) s+=`<path d="M102 96 q4 -10 0 -16 q-6 8 0 16z" fill="url(#gel)"/>`;
  if(cherry) s+=`<circle cx="104" cy="86" r="9" fill="${C.pink2}"/><circle cx="101" cy="83" r="3" fill="#fff" opacity=".6"/><path d="M106 78 q6 -14 16 -16" stroke="${C.pist2}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
     ${[[70,92],[134,100],[66,140],[142,150]].map(([x,y],i)=>`<rect x="${x}" y="${y}" width="7" height="2.6" rx="1.3" fill="${['#9BD38A','#FFD45E','#7CC6FF','#FF8FA8'][i]}" transform="rotate(${i*40} ${x} ${y})"/>`).join('')}`;
  return s;
}
function ghost(){return `<g opacity=".35" fill="none" stroke="${C.pink}" stroke-width="2" stroke-dasharray="5 5">
 <path d="M50 178 Q102 150 154 178"/><path d="M58 158 Q102 132 146 158"/><path d="M66 140 Q102 118 138 140"/></g>`;}

// reservatório (porções)
function reservoir(frac,label,x=232,y=262,col){ const w=220;
  return `<g transform="translate(${x} ${y})">
   <text x="0" y="0" font-size="13" fill="${C.choc2}">Gelato no reservatório</text>
   <text x="${w}" y="0" font-size="13" fill="${C.choc}" text-anchor="end">${label}</text>
   <rect x="0" y="8" width="${w}" height="14" rx="7" fill="#F3DCC6"/>
   <rect x="0" y="8" width="${Math.max(14,w*frac)}" height="14" rx="7" fill="${col||'url(#gel)'}"/>
   ${frac>0.05?`<circle cx="${Math.max(7,w*frac-7)}" cy="15" r="3" fill="#fff" opacity=".7"/>`:''}
  </g>`;}

function bigBtn(cx,cy,label,sub,grad='url(#btn)',icon='play',ring=null){
  let s='';
  if(ring!==null){ const r=60, c=2*Math.PI*r;
    s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#F6D3DB" stroke-width="9"/>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C.pink}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*ring} ${c}" transform="rotate(-90 ${cx} ${cy})"/>`; }
  s+=`<circle cx="${cx}" cy="${cy+5}" r="50" fill="${grad==='url(#btnG)'?'#3E8A3C':'#B92E52'}"/>
      <circle cx="${cx}" cy="${cy}" r="50" fill="${grad}" filter="url(#sh)"/>
      <ellipse cx="${cx}" cy="${cy-26}" rx="30" ry="11" fill="#fff" opacity=".28"/>`;
  if(icon==='play') s+=`<path d="M${cx-9} ${cy-24} l22 13 l-22 13z" fill="#fff"/>`;
  if(icon==='pause') s+=`<rect x="${cx-11}" y="${cy-24}" width="8" height="24" rx="2" fill="#fff"/><rect x="${cx+3}" y="${cy-24}" width="8" height="24" rx="2" fill="#fff"/>`;
  if(icon==='again') s+=`<path d="M${cx+12} ${cy-14} a14 14 0 1 1 -5 -9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M${cx+14} ${cy-28} l0 12 l-12 -2z" fill="#fff"/>`;
  s+=`<text x="${cx}" y="${icon==='none'?cy+12:cy+19}" font-size="${icon==='none'?34:(label.length>7?17:21)}" fill="#fff" text-anchor="middle" letter-spacing="1.5">${label}</text>`;
  if(sub) s+=`<text x="${cx}" y="${cy+76}" font-size="12" fill="${C.choc2}" text-anchor="middle">${sub}</text>`;
  return s;
}

function screen(inner){return `<svg width="480" height="320" viewBox="0 0 480 320" font-family="Bonnie, sans-serif">${defs()}<rect width="480" height="320" fill="url(#bg)"/>${blobs()}${inner}</svg>`;}

const FB_DB='https://ensaios-calibracoes-default-rtdb.firebaseio.com';
const MAQ_ID='MAQ01', SALE_TTL=240000;
function DF(){ return CFG&&CFG.copo_ml>0&&CFG.reservatorio_ml>0 ? CFG.copo_ml/CFG.reservatorio_ml : 1/14; } // fração do reservatório por copo
function ls(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
// preço e tempo de descida vêm do app de configuração quando aberto no mesmo aparelho
let CFG=ls('maq_cfg',null); // parâmetros recebidos do app (última versão em cache)
async function loadCfg(){ try{ const r=await fetch(`${FB_DB}/maquinas/${MAQ_ID}/config.json`,{cache:'no-store'}); const d=await r.json(); if(d&&d.tabela&&d.tabela.length>1){ CFG=d; lsSet('maq_cfg',d); } }catch(e){}
  return CFG; }
function price(){ return CFG&&CFG.preco!=null ? +CFG.preco : 12; }
function serveTime(){ const pr=ls('atl_profiles',null), c=ls('atl_cur','A'); const t=pr&&pr[c]&&pr[c].ttot; return (t>0?t:3)*1000; }
let usado=+ls('maq_usado',0); // fração do reservatório já servida (0 = cheio, 1 = vazio) — equivale à posição do êmbolo
function porcoesRest(){ return Math.max(0,Math.floor((1-usado)/DF()+1e-6)); }
const brl=v=>'R$ '+Number(v).toFixed(2).replace('.',',');

/* ════════ DESENHO DAS TELAS (mesmas da prancha) ════════ */
function hit(cx,cy,r,act){ return `<circle class="tap" data-act="${act}" cx="${cx}" cy="${cy}" r="${r}" fill="transparent"/>`; }
function hitRect(x,y,w,h,act){ return `<rect class="tap" data-act="${act}" x="${x}" y="${y}" width="${w}" height="${h}" fill="transparent"/>`; }
function resv(){ const n=porcoesRest(), f=Math.max(0,1-usado); return n>0?reservoir(f,`≈ ${n} porç${n===1?'ão':'ões'}`):reservoir(.03,'vazio',232,262,C.pink2); }
const star=([x,y,r])=>`<path d="M${x} ${y-r} L${x+r*0.3} ${y-r*0.3} L${x+r} ${y} L${x+r*0.3} ${y+r*0.3} L${x} ${y+r} L${x-r*0.3} ${y+r*0.3} L${x-r} ${y} L${x-r*0.3} ${y-r*0.3}Z" fill="#FFD45E"/>`;

/* ════════ MÁQUINA DE ESTADOS ════════ */
const S={tela:'boas',id:null,exp:0,qr:null,es:null,poll:null,timer:null,t0:0};
function render(html){ $scr.innerHTML=html; }
const $scr=document.getElementById('scr');
function stopAll(){ clearInterval(S.timer); S.timer=null; clearInterval(S.poll); S.poll=null; if(S.es){ try{S.es.close();}catch(e){} S.es=null; } }
function go(t,...a){ S.tela=t; render(T[t](...a)); }
function inicio(){ stopAll(); loadCfg().then(()=>{ if(S.tela==='boas'||S.tela==='reab') go(porcoesRest()<=0?'reab':'boas'); }); if(porcoesRest()<=0) go("reab"); else go("boas"); }
async function fbPatch(id,o){ try{ await fetch(`${FB_DB}/vendas/${id}.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}); }catch(e){} }
function newId(){ const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789', r=new Uint8Array(6); crypto.getRandomValues(r); return [...r].map(x=>a[x%a.length]).join(''); }
function makeQR(text){ const q=qrcode(0,'M'); q.addData(text); q.make(); const n=q.getModuleCount(); let d='';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d+=`M${c} ${r}h1v1h-1z`; return {n,d}; }

async function quero(){
  if(porcoesRest()<=0){ go("reab"); return; }
  stopAll(); go('gerando');
  const id=newId(); S.id=id; S.exp=Date.now()+SALE_TTL;
  try{
    const r=await fetch(`${FB_DB}/vendas/${id}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({valor:price(),maquina:MAQ_ID,status:'aguardando',criado:{'.sv':'timestamp'},expira:S.exp})});
    if(!r.ok) throw 0;
  }catch(e){ go('erro','sem conexão'); return; }
  const url=new URL('pagar.html',location.href); url.search=`?id=${id}&v=${price().toFixed(2)}`;
  S.qr=makeQR(url.href); console.log('Link do pagamento:',url.href);
  const draw=()=>{ const s=Math.max(0,Math.round((S.exp-Date.now())/1000));
    if(S.tela==='pix'||S.tela==='gerando') go('pix',S.qr,s);
    if(s<=0){ stopAll(); fbPatch(id,{status:'expirado'}); inicio(); } };
  S.tela='pix'; draw(); S.timer=setInterval(draw,1000);
  const onSt=(st)=>{ if(S.id===id && S.tela==='pix' && st==='pago') aprovado(); };
  try{ S.es=new EventSource(`${FB_DB}/vendas/${id}/status.json`); S.es.addEventListener('put',e=>{ try{ onSt(JSON.parse(e.data).data); }catch(_){} }); }catch(e){}
  S.poll=setInterval(async()=>{ try{ onSt(await (await fetch(`${FB_DB}/vendas/${id}/status.json`)).json()); }catch(e){} },3000);
}
function aprovado(){
  stopAll(); go('aprovado'); if(navigator.vibrate) navigator.vibrate([60,40,60]);
  loadCfg(); setTimeout(servir,3000);
}
function servir(){
  // a curva cobre o reservatório inteiro: este copo vai de 'usado' até 'usado + DF()' do volume total,
  // seguindo as velocidades do trecho correspondente da curva
  const u0=usado, u1=Math.min(1,usado+DF());
  let dur=3000, prog=x=>x;
  if(CFG){ const v=CFG.tabela, dt=(CFG.dt||20)/1000, cum=[0];
    for(let i=1;i<v.length;i++) cum.push(cum[i-1]+(v[i-1]+v[i])/2);
    const tot=cum[cum.length-1]||1, n=v.length-1;
    const tOf=s=>{ if(s<=0) return 0; if(s>=tot) return n*dt; let lo=0,hi=n; while(hi-lo>1){ const mm=(lo+hi)>>1; if(cum[mm]<=s) lo=mm; else hi=mm; }
      return (lo+(s-cum[lo])/Math.max(1e-9,cum[hi]-cum[lo]))*dt; };
    const sOf=t=>{ const f=Math.min(n,t/dt), i=Math.min(n-1,Math.floor(f)), k=f-i; return cum[i]+(cum[i+1]-cum[i])*k; };
    const s0=u0*tot, s1=u1*tot, t0=tOf(s0), t1=tOf(s1);
    dur=Math.max(400,(t1-t0)*1000);
    prog=x=>Math.min(1,(sOf(t0+x*(t1-t0))-s0)/Math.max(1e-9,s1-s0)); }
  const t0=performance.now(); let tick=0;
  S.tela='servindo';
  S.timer=setInterval(()=>{ const x=Math.min(1,(performance.now()-t0)/dur), p=prog(x); tick++;
    usado=u0+(u1-u0)*p;
    go('servindo',p,Math.floor(tick/6));
    if(x>=1){ stopAll(); usado=u1; lsSet('maq_usado',usado);
      fbPatch(S.id,{status:'servido',servido:{'.sv':'timestamp'}}); go('bom');
      S.timer=setTimeout(()=>{ if(S.tela==='bom') inicio(); },12000); } },50);
}
$scr.addEventListener('click',e=>{ const t=e.target.closest('.tap'); if(!t) return; const a=t.dataset.act;
  if(a==='quero') quero();
  else if(a==='cancelar'){ if(S.id) fbPatch(S.id,{status:'cancelado'}); inicio(); }
  else if(a==='outro'||a==='inicio') inicio();
  else if(a==='pronto'){ usado=0; lsSet('maq_usado',0); inicio(); } });

/* ════════ ESCALA: display 3:2 ocupando a tela ════════ */
function fit(){ const W=innerWidth-24, H=innerHeight-60; let w=Math.min(W,H*1.5); const d=document.getElementById('disp');
  $scr.style.width=w+'px'; $scr.style.height=(w/1.5)+'px'; }
addEventListener('resize',fit); fit();
document.getElementById('fs').onclick=()=>{ const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el); };
/* ════════ ATUALIZAÇÃO AUTOMÁTICA DA CONFIGURAÇÃO ════════ */
function applyCfg(d){
  if(!d||!d.tabela||d.tabela.length<2) return;
  const changed=JSON.stringify(d)!==JSON.stringify(CFG); CFG=d; lsSet('maq_cfg',d);
  if(changed && (S.tela==='boas'||S.tela==='reab')) go(porcoesRest()<=0?'reab':'boas'); // só nas telas de espera
}
(function watchCfg(){
  try{ const es=new EventSource(`${FB_DB}/maquinas/${MAQ_ID}/config.json`);
    const h=e=>{ try{ const m=JSON.parse(e.data); if(m.path==='/') applyCfg(m.data); else loadCfg().then(applyCfg); }catch(_){} };
    es.addEventListener('put',h); es.addEventListener('patch',h); }catch(e){}
  setInterval(async()=>{ try{ const r=await fetch(`${FB_DB}/maquinas/${MAQ_ID}/config.json`,{cache:'no-store'}); applyCfg(await r.json()); }catch(e){} },5000);
})();

// 1ª abertura: espera a configuração do Firebase (máx. 2,5 s) antes de desenhar, para não mostrar valores antigos
if(CFG) inicio(); else { render(screen('')); Promise.race([loadCfg(),new Promise(r=>setTimeout(r,2500))]).then(inicio); }
